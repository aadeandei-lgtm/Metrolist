name: Build Metrolist Head Unit

on:
  workflow_dispatch:

concurrency:
  group: metrolist-headunit
  cancel-in-progress: true

jobs:
  build:
    name: APK armeabi-v7a (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK (NDK 30 + CMake 4.1.2)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools cmdline-tools;latest ndk;30.0.16248370 cmake;4.1.2'

      - name: Build head-unit APK (release-optimised, debug-signed)
        run: ./gradlew :androidApp:assembleHeadunit --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-headunit
          path: androidApp/build/outputs/apk/headunit/*.apk
          if-no-files-found: error
